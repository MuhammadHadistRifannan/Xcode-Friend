services:
  app:
    build:
      context: .
      target: app
    container_name: xcode-friend-app
    restart: unless-stopped
    expose:
      - "9000"
      - "8080"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USERNAME=xcode
      - DB_PASSWORD=secret
      - DB_DATABASE=xcode-friend
      - QUEUE_CONNECTION=database
      - BROADCAST_CONNECTION=reverb
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
      - VITE_REVERB_HOST=localhost
      - VITE_REVERB_PORT=80
      - WEBSOCKET_PORT=80
      - ENABLE_REVERB=${ENABLE_REVERB:-1}
      - ENABLE_QUEUE=${ENABLE_QUEUE:-1}
      - ENABLE_SCHEDULER=${ENABLE_SCHEDULER:-1}
      - QUEUE_WORKERS=${QUEUE_WORKERS:-1}
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-1}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage/app
      - app-framework:/var/www/html/storage/framework
      - app-logs:/var/www/html/storage/logs
    # php-fpm is the container CMD; Reverb + queue run as side processes

  nginx:
    build:
      context: .
      target: webserver
    container_name: xcode-friend-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    volumes:
      - app-storage:/var/www/html/storage/app

  db:
    image: mysql:8.0
    container_name: xcode-friend-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: xcode-friend
      MYSQL_USER: xcode
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  app-storage:
  app-framework:
  app-logs: